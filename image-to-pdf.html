<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image to PDF - ID Tools</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: white;
  padding: 18px;
  text-align: center;
  box-shadow: 0 2px 10px #ddd;
}

header h1 {
  margin: 0;
  color: #2563eb;
}

.container {
  width: 94%;
  max-width: 700px;
  margin: 25px auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 20px #ddd;
}

.upload {
  border: 2px dashed #2563eb;
  border-radius: 12px;
  padding: 25px 15px;
  text-align: center;
}

input[type="file"] {
  width: 100%;
  margin-top: 15px;
}

#preview {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 20px;
}

.image-box {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 8px;
  background: #fafafa;
}

.image-box img {
  width: 100%;
  height: 150px;
  object-fit: contain;
  border-radius: 6px;
}

.image-box p {
  margin: 7px 0 0;
  text-align: center;
  font-size: 13px;
  color: #666;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: 0;
  border-radius: 9px;
  background: #2563eb;
  color: white;
  font-size: 16px;
}

button:disabled {
  background: #aaa;
}

.clear {
  background: #dc2626;
}

.status {
  text-align: center;
  margin-top: 12px;
  color: #666;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>📄 Image to PDF</h1>
</header>

<div class="container">

  <div class="upload">

    <h2>Select Images</h2>

    <p>
      Choose one or multiple images from your phone.
    </p>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
    >

  </div>

  <div id="preview"></div>

  <button
    id="createButton"
    onclick="createPDF()"
    disabled
  >
    📥 Create PDF
  </button>

  <button
    class="clear"
    onclick="clearImages()"
  >
    🗑️ Clear All
  </button>

  <div
    class="status"
    id="status"
  ></div>

</div>


<script>

const input =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const createButton =
  document.getElementById("createButton");

const status =
  document.getElementById("status");

let files = [];


input.addEventListener("change", function() {

  files =
    Array.from(input.files);

  showPreview();

});


function showPreview() {

  preview.innerHTML = "";

  if (files.length === 0) {

    createButton.disabled = true;

    return;

  }


  files.forEach(function(file, index) {

    const box =
      document.createElement("div");

    box.className =
      "image-box";


    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);


    const name =
      document.createElement("p");

    name.innerText =
      (index + 1) + ". " + file.name;


    box.appendChild(img);

    box.appendChild(name);

    preview.appendChild(box);

  });


  createButton.disabled = false;

  status.innerText =
    files.length +
    " image(s) selected.";

}


function loadImage(file) {

  return new Promise(function(resolve, reject) {

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        const img =
          new Image();

        img.onload =
          function() {

            resolve(img);

          };

        img.onerror =
          reject;

        img.src =
          event.target.result;

      };

    reader.onerror =
      reject;

    reader.readAsDataURL(file);

  });

}


async function createPDF() {

  if (files.length === 0) {

    alert("Please select images first.");

    return;

  }


  status.innerText =
    "Creating PDF...";


  try {

    /*
      A4 page size
      595 × 842 points
    */

    const pages = [];


    for (const file of files) {

      const img =
        await loadImage(file);


      const canvas =
        document.createElement("canvas");

      canvas.width = 794;
      canvas.height = 1123;


      const ctx =
        canvas.getContext("2d");


      ctx.fillStyle = "white";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      const margin = 40;

      const maxWidth =
        canvas.width - margin * 2;

      const maxHeight =
        canvas.height - margin * 2;


      const scale =
        Math.min(
          maxWidth / img.width,
          maxHeight / img.height
        );


      const width =
        img.width * scale;

      const height =
        img.height * scale;


      const x =
        (canvas.width - width) / 2;

      const y =
        (canvas.height - height) / 2;


      ctx.drawImage(
        img,
        x,
        y,
        width,
        height
      );


      pages.push(canvas);

    }


    /*
      Create PDF using browser
      print dialog.

      This is a simple free method
      that works without a server.
    */

    let html = "";

    pages.forEach(function(canvas) {

      html += `
        <div class="page">
          <img src="${canvas.toDataURL("image/jpeg", 0.9)}">
        </div>
      `;

    });


    const pdfWindow =
      window.open("", "_blank");


    pdfWindow.document.write(`
      <!DOCTYPE html>

      <html>

      <head>

      <title>Image PDF</title>

      <style>

      @page {
        size: A4;
        margin: 0;
      }

      body {
        margin: 0;
      }

      .page {
        width: 210mm;
        height: 297mm;
        display: flex;
        justify-content: center;
        align-items: center;
        page-break-after: always;
      }

      .page img {
        max-width: 190mm;
        max-height: 277mm;
        object-fit: contain;
      }

      </style>

      </head>

      <body>

      ${html}

      <script>

      window.onload = function() {
        window.print();
      };

      <\/script>

      </body>

      </html>
    `);


    pdfWindow.document.close();


    status.innerText =
      "PDF ready. Choose 'Save as PDF'.";

  }

  catch(error) {

    console.error(error);

    status.innerText =
      "Could not create PDF.";

  }

}


function clearImages() {

  files = [];

  input.value = "";

  preview.innerHTML = "";

  createButton.disabled = true;

  status.innerText = "";

}

</script>

</body>
</html>
