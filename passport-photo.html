<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passport Photo Maker - ID Tools</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

.navbar{
  background:#111827;
  padding:16px 20px;
}

.navbar a{
  color:white;
  text-decoration:none;
  font-size:20px;
  font-weight:bold;
}

.container{
  max-width:750px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

.upload{
  border:2px dashed #9ca3af;
  padding:25px;
  text-align:center;
  border-radius:12px;
  margin-bottom:20px;
}

input[type="file"]{
  width:100%;
  padding:10px;
}

.controls{
  margin-top:20px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

.generate{
  background:#2563eb;
  color:white;
}

.download{
  background:#16a34a;
  color:white;
  display:none;
}

.preview{
  text-align:center;
  margin-top:25px;
}

#previewCanvas{
  max-width:100%;
  border-radius:8px;
  display:none;
  margin:15px auto;
}

.info{
  background:#f3f4f6;
  padding:14px;
  border-radius:10px;
  margin-top:15px;
  line-height:1.6;
}

@media(max-width:600px){
  .card{
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">🛠️ ID Tools</a>
</div>

<div class="container">

<div class="card">

<h1>Passport Photo Maker</h1>

<p class="subtitle">
Create a passport-style photo from your image.
</p>

<div class="upload">

<p style="margin-bottom:12px;">
Choose your photo
</p>

<input
  type="file"
  id="imageInput"
  accept="image/*"
>

</div>

<div class="controls">

<label for="photoSize">
Choose photo size
</label>

<select id="photoSize">

<option value="35x45">
35 × 45 mm
</option>

<option value="2x2">
2 × 2 inch
</option>

<option value="40x60">
40 × 60 mm
</option>

</select>

</div>

<button
  class="generate"
  onclick="createPhoto()"
>
Create Passport Photo
</button>

<div class="preview">

<h3 id="previewTitle" style="display:none;">
Preview
</h3>

<canvas id="previewCanvas"></canvas>

</div>

<button
  class="download"
  id="downloadBtn"
  onclick="downloadPhoto()"
>
Download Photo
</button>

<div class="info">
<b>Important:</b> The selected size controls the
output aspect ratio. Check the official photo
requirements of the country or organization you
are applying to before submitting.
</div>

</div>

</div>

<script>

let selectedFile = null;
let outputCanvas = null;

const imageInput =
  document.getElementById("imageInput");

imageInput.addEventListener("change", function(){

  selectedFile = this.files[0];

});

function createPhoto(){

  if(!selectedFile){

    alert("Please select a photo first.");

    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.onload = function(){

      const size =
        document.getElementById("photoSize").value;

      let targetRatio;

      if(size === "35x45"){

        targetRatio = 35 / 45;

      }else if(size === "2x2"){

        targetRatio = 1;

      }else if(size === "40x60"){

        targetRatio = 40 / 60;

      }

      const imageRatio =
        img.width / img.height;

      let cropWidth;
      let cropHeight;
      let startX = 0;
      let startY = 0;

      if(imageRatio > targetRatio){

        cropHeight = img.height;
        cropWidth =
          img.height * targetRatio;

        startX =
          (img.width - cropWidth) / 2;

      }else{

        cropWidth = img.width;
        cropHeight =
          img.width / targetRatio;

        startY =
          (img.height - cropHeight) / 2;

      }

      const width = 700;

      const height =
        Math.round(width / targetRatio);

      const canvas =
        document.getElementById("previewCanvas");

      canvas.width = width;
      canvas.height = height;

      const ctx =
        canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";

      ctx.fillRect(
        0,
        0,
        width,
        height
      );

      ctx.drawImage(
        img,
        startX,
        startY,
        cropWidth,
        cropHeight,
        0,
        0,
        width,
        height
      );

      outputCanvas = canvas;

      canvas.style.display = "block";

      document.getElementById(
        "previewTitle"
      ).style.display = "block";

      document.getElementById(
        "downloadBtn"
      ).style.display = "block";

    };

    img.src = e.target.result;

  };

  reader.readAsDataURL(selectedFile);

}

function downloadPhoto(){

  if(!outputCanvas){

    alert("Please create the photo first.");

    return;
  }

  const link =
    document.createElement("a");

  link.download =
    "passport-photo.jpg";

  link.href =
    outputCanvas.toDataURL(
      "image/jpeg",
      0.95
    );

  link.click();

}

</script>

</body>
</html>
